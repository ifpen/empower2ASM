name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core:
    # Builds and tests Core only: the Empower adapter and CLI need the commercial Empower Toolkit, which CI doesn't have.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Test
        run: dotnet test Empower2Asm.Core.slnf --configuration Release
